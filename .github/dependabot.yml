version: 2

updates:
  # Keeps the GitHub Actions used by the workflows patched. The actions are
  # pinned to commit SHAs, and Dependabot proposes new SHAs with the version
  # noted in the comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keeps the AWS provider and its lock file current for project 03.
  - package-ecosystem: "terraform"
    directory: "/projects/03-multi-region-hub-and-spoke-web-application-with-centralized-siem/terraform"
    schedule:
      interval: "weekly"

  # Keeps the AWS and archive providers and their lock file current for project 04.
  - package-ecosystem: "terraform"
    directory: "/projects/04-waf-bedrock-threat-correlation-and-soar-pipeline/terraform"
    schedule:
      interval: "weekly"

  # Keeps the AWS, Google and random providers and their lock file current for project 05.
  - package-ecosystem: "terraform"
    directory: "/projects/05-gcp-to-aws-ha-vpn-secure-connectivity/envs/01-ha-vpn"
    schedule:
      interval: "weekly"

  # Keeps the pinned Jenkins and Docker CLI base images in project 06 current.
  # Only the Dockerfile is read here. The Jenkins plugin pins in plugins.yaml and
  # the images in docker-compose.yml are not covered and are bumped by hand.
  - package-ecosystem: "docker"
    directory: "/projects/06-jenkins-devsecops-ci-cd-pipeline/jenkins"
    schedule:
      interval: "weekly"

  # Keeps the Python base images of the sample app current for project 06.
  - package-ecosystem: "docker"
    directory: "/projects/06-jenkins-devsecops-ci-cd-pipeline/app"
    schedule:
      interval: "weekly"

  # Keeps the sample app's pinned Python dependencies current for project 06.
  # demo/requirements.vulnerable.txt is deliberately outdated, so it is not scanned:
  # Dependabot only reads the directory listed here, and demo/ is not that directory.
  - package-ecosystem: "pip"
    directory: "/projects/06-jenkins-devsecops-ci-cd-pipeline/app"
    schedule:
      interval: "weekly"
