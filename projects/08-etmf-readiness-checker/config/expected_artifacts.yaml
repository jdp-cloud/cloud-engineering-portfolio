# Expected documents for synthetic study SYNTH-PH3-001.
# Zones follow the DIA TMF Reference Model.
# Zone 08 is Central and Local Testing. Zone 09 is Third Parties and is not used here.
# Form FDA 1572 is required only in the United States.

study_id: SYNTH-PH3-001
compound: EX-100
protocol: EXAMPLE-001
as_of: "2026-11-09"
expiry_soon_days: 60
critical_score_cap: 49

