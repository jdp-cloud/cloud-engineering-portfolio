worker_processes 1;

events {
    worker_connections 128;
}

http {
    server {
        listen 8080;

        # Same split the ALB will use: /api/* to the API, everything else to web.
        # /health on this port therefore lands on web. Use /api/health for the API.
        location /api/ {
            proxy_pass http://api:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
