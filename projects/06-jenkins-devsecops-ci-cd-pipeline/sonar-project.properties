sonar.projectKey=sample-app
sonar.projectName=sample-app
sonar.sourceEncoding=UTF-8

# Application code and its tests (paths are relative to the workspace root)
sonar.sources=app
sonar.exclusions=app/tests/**
sonar.tests=app/tests
sonar.python.version=3.12

# Reviewed exclusion: python:S4502 ("Make sure disabling CSRF protection is safe here") fires on the Flask app.
# The service exposes GET routes only and nothing changes state, so CSRF protection does not apply.
# Revisit this the moment a POST, PUT, PATCH or DELETE route is added.
sonar.issue.ignore.multicriteria=csrf-get-only
sonar.issue.ignore.multicriteria.csrf-get-only.ruleKey=python:S4502
sonar.issue.ignore.multicriteria.csrf-get-only.resourceKey=app/main.py

# Written by the "Unit tests" stage (pytest-cov and pytest --junitxml)
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml
